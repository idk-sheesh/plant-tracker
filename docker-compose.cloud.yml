name: gardenjournal-cloud

services:
  gardenjournal-api:
    build:
      context: .
      dockerfile: cloud_api/Dockerfile
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --database
      - /var/lib/gardenjournal/gardenjournal-cloud.db
      - --behind-tls-proxy
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${GARDENJOURNAL_DATA_DIR:-./cloud_data}:/var/lib/gardenjournal
      - ${GARDENJOURNAL_BACKUP_DIR:-./cloud_backups}:/var/backups/gardenjournal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloudflared:
    profiles:
      - edge
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:REPLACE_WITH_PINNED_VERSION}
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-REPLACE_WITH_TUNNEL_TOKEN}
    depends_on:
      gardenjournal-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
