name: garden_journal
description: Carnet de jardinage pour tomates et orchidées
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  qr_flutter: ^4.1.0
  qr: ^3.0.2
  mobile_scanner: ^7.2.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  share_plus: ^13.2.0
  intl: ^0.19.0
  uuid: ^4.3.3
  pdf: ^3.10.7
  http: ^1.2.0
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  crypto: ^3.0.7
  mqtt_client: 10.11.11
  cryptography: 2.9.0
  flutter_reactive_ble: 5.5.0
  permission_handler: 12.0.3
  flutter_secure_storage: 10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
